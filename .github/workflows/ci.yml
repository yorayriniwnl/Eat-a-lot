name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NODE_ENV: production
      PORT: "3100"
      JWT_SECRET: candidate-ci-jwt-secret
      ADMIN_USERNAME: ci-admin
      ADMIN_PASSWORD: ci-password
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Set up Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: "22"
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Production dependency audit
        run: npm audit --omit=dev --audit-level=high
      - name: Design contract
        run: npm run design:check
      - name: JavaScript syntax
        run: |
          node --check server.js
          node --check api/index.js
          node --check routes/admin.js
          node --check routes/menu.js
          node --check routes/orders.js
          node --check routes/settings.js
          node --check middleware/auth.js
          node --check db/database.js
      - name: Health smoke test
        shell: bash
        run: |
          npm start > /tmp/eat-a-lot.log 2>&1 &
          pid=$!
          trap 'kill "$pid" 2>/dev/null || true' EXIT
          for i in {1..30}; do
            if curl --fail --silent http://127.0.0.1:3100/api/health >/tmp/health.json; then break; fi
            sleep 1
          done
          cat /tmp/health.json
          grep -q '"status":"ok"' /tmp/health.json
